{% extends "base.html" %}
{% block title %}Sign On{% endblock %}
{% block content %}
<table class="panel" cellpadding="6" cellspacing="0" width="360">
  <tr><td class="section-title" colspan="2">OPERATOR SIGN ON</td></tr>
  {% if error %}
  <tr><td colspan="2" class="message">{{ error }}</td></tr>
  {% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <tr>
      <td><label for="username">User ID:</label></td>
      <td><input id="username" name="username" size="20" autocomplete="off"></td>
    </tr>
    <tr>
      <td><label for="password">Password:</label></td>
      <td><input id="password" name="password" type="password" size="20"></td>
    </tr>
    <tr><td></td><td><input type="submit" value="Sign On"></td></tr>
  </form>
</table>
{% endblock %}
