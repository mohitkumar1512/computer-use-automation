[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery, recorded capabilities, deterministic replay."
requires-python = ">=3.12"
dependencies = [
    "playwright==1.55.0",
]

[dependency-groups]
dev = ["pytest>=8"]
mock = ["flask>=3"]

[tool.uv]
default-groups = ["dev", "mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
